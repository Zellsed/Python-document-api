[project]
name = "mini-document-api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [{ name = "Zellsed", email = "zellsed123@gmail.com" }]
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.141.1",
  "httpx>=0.28.1",
  "httpx2>=2.12.0",
  "loguru>=0.7.3",
  "psycopg>=3.3.5",
  "pydantic>=2.13.5",
  "pytest>=9.1.1",
  "redis>=8.1.0",
  "sqlalchemy>=2.0.52",
]

[project.scripts]
mini-document-api = "mini_document_api:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
pythonpath = ["."]
